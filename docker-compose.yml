# 로컬 개발용: PostgreSQL + API 서버
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: earth
      POSTGRES_PASSWORD: earth
      POSTGRES_DB: earth_travel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./server
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://earth:earth@db:5432/earth_travel
      JWT_SECRET: local-dev-secret-change-me
      PUBLIC_BASE_URL: http://localhost:4000
      STORAGE_DRIVER: local
      UPLOAD_DIR: /data/uploads
    ports: ["4000:4000"]
    volumes: [uploads:/data/uploads]

volumes:
  pgdata:
  uploads:
